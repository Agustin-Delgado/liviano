name: Algo no funciona
description: Un error, un cierre inesperado o algo que se comporta distinto de lo esperado.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportarlo. Si es un problema de seguridad, **no lo cuentes acá**: usá *Security* → *Report a vulnerability*.
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Qué viste y qué esperabas ver.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Cómo reproducirlo
      description: Los pasos, desde abrir Nea. Si pasa en un sitio en particular, la dirección.
      placeholder: |
        1. Abrir una pestaña nueva con Ctrl+T
        2. Escribir ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de Nea
      description: Está en Ajustes → Actualizaciones. Si lo compilaste, el commit.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: crash.log o hang.log
      description: |
        Si Nea se cerró o quedó "sin responder", pegá lo último de `crash.log` o `hang.log` (en `%APPDATA%\Nea`). Revisalo antes: puede tener direcciones de páginas que visitaste.
      render: text
  - type: textarea
    id: capturas
    attributes:
      label: Capturas
      description: Si se ve mal, una captura ayuda mucho.
