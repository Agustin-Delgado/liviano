name: Bug report
description: A bug, a crash or an unexpected behavior.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Do not report a security problem here. Use *Security* → *Report a vulnerability*.
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: Tell what you saw and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the steps from the start of Nea. If the problem occurs on a specific site, give its address.
      placeholder: |
        1. Open a new tab with Ctrl+T
        2. Type ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nea version
      description: Find it in Settings → Updates. If you built Nea, give the commit.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: crash.log or hang.log
      description: |
        If Nea closed or stopped responding, paste the end of `crash.log` or `hang.log` (in `%APPDATA%\Nea`). Read the file first. It can contain the addresses of pages that you visited.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If an item looks wrong, add a screenshot.
