[package]
name = "liviano"
version = "0.1.0"
edition = "2024"
description = "Navegador liviano para Windows: una fila de pestañas, un campo y la página."
license = "MIT"

[dependencies]
ed25519-compact = { version = "2.6.1", default-features = false }
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
webview2-com = "0.39.1"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
# Only the key generator needs randomness.
ed25519-compact = { version = "2.6.1", features = ["random"] }
